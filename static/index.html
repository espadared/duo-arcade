<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d17">
<meta name="description" content="A pile of two-player games. Pick one, share the link, play together on your own phones.">
<title>Duo Arcade — games for two</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎮</text></svg>">

<!-- so it can be kept on a phone's home screen and open without browser chrome -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duo Arcade">

<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <div class="boot">
    <div class="mark"><i></i><i></i></div>
    <h1>Duo Arcade</h1>
    <p class="small">Games for two</p>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="/static/util.js"></script>
<script src="/static/games/tictactoe.js"></script>
<script src="/static/games/connect4.js"></script>
<script src="/static/games/rps.js"></script>
<script src="/static/games/memory.js"></script>
<script src="/static/games/wordladder.js"></script>
<script src="/static/games/dots.js"></script>
<script src="/static/games/crosswires.js"></script>
<script src="/static/games/bridges.js"></script>
<script src="/static/games/gomoku.js"></script>
<script src="/static/games/reversi.js"></script>
<script src="/static/games/poker.js"></script>
<script src="/static/games/xiangqi.js"></script>
<script src="/static/app.js"></script>
<script>
  // Only on the website: inside a phone app the files are already on the device.
  if ('serviceWorker' in navigator && !window.Capacitor) {
    addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
